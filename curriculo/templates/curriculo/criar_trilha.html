<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Nova Trilha — Trilha Ensino</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen font-sans p-6 md:p-10">
<div class="max-w-3xl mx-auto">
<div class="flex justify-between items-center mb-8 gap-4"><div><p class="text-xs uppercase tracking-widest text-slate-500 font-black">Estúdio</p><h1 class="text-3xl font-black text-indigo-700 mt-1">Criar Nova Trilha</h1></div><a href="{% url 'dashboard_professor' %}" class="font-bold text-slate-500 hover:text-slate-900">Voltar</a></div>
<div class="bg-white border border-slate-200 rounded-3xl shadow-xl p-7 md:p-9">
<div class="rounded-2xl border border-yellow-200 bg-yellow-50 p-5 mb-7"><p class="font-black text-yellow-800">Sua trilha começará como rascunho.</p><p class="text-sm text-yellow-700 mt-1">Cadastre o conteúdo e publique somente quando estiver pronta para os alunos.</p></div>
<form method="post" class="space-y-6">{% csrf_token %}
<div><label class="block font-bold text-slate-700 mb-2">Nome do jogo</label>{{ form.nome }}</div>
<div><label class="block font-bold text-slate-700 mb-2">Slug / endereço</label>{{ form.slug }}</div>
<div><label class="block font-bold text-slate-700 mb-2">Descrição</label>{{ form.descricao }}</div>
<div><label class="block font-bold text-slate-700 mb-2">Tema padrão da trilha</label>{{ form.tema }}</div>
<button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl shadow-lg">Criar rascunho</button>
</form>
</div>
</div>
</body>
</html>

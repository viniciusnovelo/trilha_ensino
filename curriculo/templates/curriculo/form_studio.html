<!DOCTYPE html>
<html lang="pt-br">
<head><title>{{ titulo_pagina }}</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 text-slate-900 min-h-screen p-8">
    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-indigo-700">{{ titulo_pagina }}</h1>
            <a href="{{ url_voltar }}" class="text-slate-500 font-bold hover:underline">Cancelar</a>
        </div>
        
        <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                {% for field in form %}
                <div>
                    <label class="block text-slate-700 font-bold mb-2">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                    <p class="text-sm text-slate-500 mt-1">{{ field.help_text }}</p>
                    {% endif %}
                </div>
                {% endfor %}
                <div class="pt-4">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition shadow-lg">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
